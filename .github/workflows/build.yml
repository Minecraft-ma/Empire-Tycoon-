name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          chmod +x gradlew
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"empire-tycoon","storage_bucket":"empire-tycoon.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.empiretycoon.vkmqza"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyMockKeyForBuildOnly123456789"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=daemon -Dksp.incremental=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-tycoon-apk
          path: app/build/outputs/apk/debug/*.apk
