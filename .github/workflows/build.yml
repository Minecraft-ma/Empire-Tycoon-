name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          chmod +x gradlew
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"empire-tycoon","storage_bucket":"empire-tycoon.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.empiretycoon.vkmqza"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyMockKeyForBuildOnly123456789"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK with Gradle Wrapper
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=daemon -Dksp.incremental=false
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/EmpireTycoon.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmpireTycoon-APK
          path: release-output/EmpireTycoon.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Download direct sur téléphone)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          gh release create latest release-output/EmpireTycoon.apk \
            --target "${{ github.sha }}" \
            --clobber \
            --title "Empire Tycoon - Dernier APK Jouable" \
            --notes "Téléchargez et installez directement l'APK **EmpireTycoon.apk** ci-dessous sur votre smartphone Android."

